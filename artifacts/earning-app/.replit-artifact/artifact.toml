kind = "web"
previewPath = "/"
title = "Bangla Task Hub"
version = "1.0.0"
id = "artifacts/earning-app"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22005

[services.development]
run = "pnpm --filter @workspace/earning-app run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/earning-app", "run", "build" ]
serve = "static"
publicDir = "artifacts/earning-app/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22005"
BASE_PATH = "/"
