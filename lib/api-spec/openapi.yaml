openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Bangla Task Hub Telegram mini app API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Telegram authentication
  - name: user
    description: End-user facing operations
  - name: admin
    description: Admin panel operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/session:
    post:
      operationId: authenticate
      tags: [auth]
      summary: Authenticate the current Telegram user and upsert their record
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthInput"
      responses:
        "200":
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"

  /me:
    get:
      operationId: getMe
      tags: [user]
      summary: Get the current authenticated user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /config/public:
    get:
      operationId: getPublicConfig
      tags: [user]
      summary: Get public app configuration relevant to the current user
      responses:
        "200":
          description: Public configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicConfig"

  /leaderboard:
    get:
      operationId: getReferralLeaderboard
      tags: [user]
      summary: Get top referrers leaderboard
      responses:
        "200":
          description: Top referrers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeaderboardResponse"

  /tasks:
    get:
      operationId: listTasks
      tags: [user]
      summary: List active tasks with the current user's completion status
      responses:
        "200":
          description: Task list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TaskWithStatus"

  /tasks/{id}/complete:
    post:
      operationId: completeTask
      tags: [user]
      summary: Mark a task as completed by the current user and credit the reward
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Task completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskCompletionResult"

  /ad-networks:
    get:
      operationId: listPublicAdNetworks
      tags: [user]
      summary: List enabled ad networks
      responses:
        "200":
          description: Enabled ad networks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PublicAdNetwork"

  /ads/watch:
    post:
      operationId: watchAd
      tags: [user]
      summary: Record a completed rewarded ad view and credit the reward
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WatchAdInput"
      responses:
        "200":
          description: Ad reward credited
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdWatchResult"

  /ads/claim:
    post:
      operationId: claimAd
      tags: [user]
      summary: Reserve a daily ad-watch slot before showing the ad, for postback-verified crediting
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClaimAdInput"
      responses:
        "200":
          description: Claim reserved; pass claimId to the ad network's show call
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClaimAdResult"

  /ads/postback:
    get:
      operationId: adPostback
      tags: [public]
      summary: Server-to-server confirmation from the ad network that a rewarded view completed
      parameters:
        - name: secret
          in: query
          required: true
          schema: { type: string }
        - name: claim_id
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Postback processed (idempotent; always 200 so the network doesn't retry)
    post:
      operationId: adPostbackPost
      tags: [public]
      summary: Same as GET /ads/postback, for networks that call postbacks via POST
      parameters:
        - name: secret
          in: query
          required: true
          schema: { type: string }
        - name: claim_id
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Postback processed (idempotent; always 200 so the network doesn't retry)

  /referrals:
    get:
      operationId: listReferrals
      tags: [user]
      summary: Get the current user's referral summary and referred users
      responses:
        "200":
          description: Referral summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReferralsSummary"

  /withdrawals:
    get:
      operationId: listWithdrawals
      tags: [user]
      summary: List the current user's withdrawal history
      responses:
        "200":
          description: Withdrawal history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Withdrawal"
    post:
      operationId: requestWithdrawal
      tags: [user]
      summary: Request a withdrawal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WithdrawalInput"
      responses:
        "201":
          description: Withdrawal requested
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Withdrawal"

  /verification/status:
    get:
      operationId: getVerificationStatus
      tags: [user]
      summary: Get the account verification state for the current user
      responses:
        "200":
          description: Verification status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerificationStatus"

  /verification/request:
    post:
      operationId: submitVerification
      tags: [user]
      summary: Submit an account verification payment for review
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerificationSubmitInput"
      responses:
        "201":
          description: Verification submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerificationRequest"

  /admin/verifications:
    get:
      operationId: listAdminVerifications
      tags: [admin]
      summary: List account verification requests
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [pending, approved, rejected]
      responses:
        "200":
          description: Verification requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminVerification"

  /admin/verifications/{id}/approve:
    post:
      operationId: approveVerification
      tags: [admin]
      summary: Approve a verification request (also places the parked withdrawal)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Verification approved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerificationDecisionResult"

  /admin/verifications/{id}/reject:
    post:
      operationId: rejectVerification
      tags: [admin]
      summary: Reject a verification request
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Verification rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerificationDecisionResult"

  /admin/dashboard:
    get:
      operationId: getAdminDashboard
      tags: [admin]
      summary: Get admin dashboard summary
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminDashboard"

  /admin/users:
    get:
      operationId: listAdminUsers
      tags: [admin]
      summary: Search and list users
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminUser"

  /admin/users/{id}/ban:
    post:
      operationId: banUser
      tags: [admin]
      summary: Ban a user
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: User banned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"

  /admin/users/{id}/unban:
    post:
      operationId: unbanUser
      tags: [admin]
      summary: Unban a user
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: User unbanned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"

  /admin/flagged/{id}/clear:
    post:
      operationId: clearFlaggedUser
      tags: [admin]
      summary: Clear a user's fraud flag
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Flag cleared
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"

  /admin/payouts:
    get:
      operationId: listPendingPayouts
      tags: [admin]
      summary: List pending withdrawal requests
      responses:
        "200":
          description: Pending payouts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminWithdrawal"

  /admin/payouts/{id}/approve:
    post:
      operationId: approvePayout
      tags: [admin]
      summary: Approve and mark a withdrawal as paid
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Payout approved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminWithdrawal"

  /admin/payouts/{id}/reject:
    post:
      operationId: rejectPayout
      tags: [admin]
      summary: Reject a withdrawal request
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RejectPayoutInput"
      responses:
        "200":
          description: Payout rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminWithdrawal"

  /admin/payouts/{id}/account-number:
    post:
      operationId: updatePayoutAccountNumber
      tags: [admin]
      summary: Correct the payout account number on a pending withdrawal
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePayoutAccountNumberInput"
      responses:
        "200":
          description: Account number updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminWithdrawal"

  /admin/tasks:
    get:
      operationId: listAdminTasks
      tags: [admin]
      summary: List all tasks
      responses:
        "200":
          description: Tasks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Task"
    post:
      operationId: createTask
      tags: [admin]
      summary: Create a task
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskInput"
      responses:
        "201":
          description: Task created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"

  /admin/tasks/{id}:
    patch:
      operationId: updateTask
      tags: [admin]
      summary: Update a task
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskUpdate"
      responses:
        "200":
          description: Task updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
    delete:
      operationId: deleteTask
      tags: [admin]
      summary: Delete a task
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Task deleted (or, if it already has completions, hidden from the admin list to preserve reward history)

  /admin/ad-networks:
    get:
      operationId: listAdminAdNetworks
      tags: [admin]
      summary: List all ad networks
      responses:
        "200":
          description: All ad networks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminAdNetwork"
    post:
      operationId: createAdNetwork
      tags: [admin]
      summary: Create a new ad network
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdNetworkInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAdNetwork"

  /admin/ad-networks/{id}:
    put:
      operationId: updateAdNetwork
      tags: [admin]
      summary: Update an ad network
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdNetworkInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAdNetwork"
    delete:
      operationId: deleteAdNetwork
      tags: [admin]
      summary: Delete an ad network
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /admin/config:
    get:
      operationId: getAdminConfig
      tags: [admin]
      summary: Get app configuration
      responses:
        "200":
          description: App configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppConfig"
    patch:
      operationId: updateAdminConfig
      tags: [admin]
      summary: Update app configuration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfigUpdate"
      responses:
        "200":
          description: App configuration updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppConfig"

  /admin/config/postback-secret:
    post:
      operationId: regeneratePostbackSecret
      tags: [admin]
      summary: Regenerate the shared secret used to authenticate incoming ad postback calls
      responses:
        "200":
          description: New postback URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PostbackUrlInfo"

  /admin/broadcast:
    post:
      operationId: sendBroadcast
      tags: [admin]
      summary: Send a broadcast message to all users via the Telegram bot
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BroadcastInput"
      responses:
        "200":
          description: Broadcast sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BroadcastResult"

  /admin/webhook/status:
    get:
      operationId: getWebhookStatus
      tags: [admin]
      summary: Get the Telegram bot webhook status
      responses:
        "200":
          description: Webhook status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookStatus"

  /admin/webhook/reset:
    post:
      operationId: resetWebhook
      tags: [admin]
      summary: Reset the Telegram bot webhook
      responses:
        "200":
          description: Webhook reset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookStatus"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    TaskType:
      type: string
      enum: [youtube, facebook, telegram, join_bonus, bonus, other]

    WithdrawalMethod:
      type: string
      enum: [bkash, nagad]

    WithdrawalStatus:
      type: string
      enum: [pending, paid, rejected]

    AdNetwork:
      type: string
      enum: [monetag, adsgram]

    AdNetworkSdkType:
      type: string
      enum: [monetag, adsgram, custom]

    PublicAdNetwork:
      type: object
      required: [id, name, sdkType, zoneId, sdkUrl, callTemplate, sortOrder]
      properties:
        id: { type: integer }
        name: { type: string }
        sdkType: { $ref: "#/components/schemas/AdNetworkSdkType" }
        zoneId: { type: string }
        sdkUrl: { type: ["string", "null"] }
        callTemplate: { type: ["string", "null"] }
        sortOrder: { type: integer }

    AdminAdNetwork:
      type: object
      required: [id, name, sdkType, zoneId, sdkUrl, callTemplate, isEnabled, sortOrder, createdAt]
      properties:
        id: { type: integer }
        name: { type: string }
        sdkType: { $ref: "#/components/schemas/AdNetworkSdkType" }
        zoneId: { type: string }
        sdkUrl: { type: ["string", "null"] }
        callTemplate: { type: ["string", "null"] }
        isEnabled: { type: boolean }
        sortOrder: { type: integer }
        createdAt: { type: string, format: date-time }

    AdNetworkInput:
      type: object
      required: [name, sdkType, zoneId]
      properties:
        name: { type: string }
        sdkType: { $ref: "#/components/schemas/AdNetworkSdkType" }
        zoneId: { type: string }
        sdkUrl: { type: ["string", "null"] }
        callTemplate: { type: ["string", "null"] }
        isEnabled: { type: boolean }
        sortOrder: { type: integer }

    AuthInput:
      type: object
      properties:
        startParam:
          type: ["string", "null"]
        deviceId:
          type: ["string", "null"]

    User:
      type: object
      required:
        - id
        - telegramId
        - firstName
        - username
        - photoUrl
        - balance
        - totalEarned
        - totalWithdrawn
        - referralCode
        - referredBy
        - isBanned
        - isVerified
        - isFlagged
        - flagReason
        - vpnStrikeCount
        - vpnBlockedUntil
        - todayAdsWatched
        - todayTasksCount
        - totalTasksCount
        - rejectedWithdrawCount
        - createdAt
        - lastActiveAt
      properties:
        id: { type: integer }
        telegramId: { type: string }
        firstName: { type: string }
        username: { type: ["string", "null"] }
        photoUrl: { type: ["string", "null"] }
        balance: { type: number }
        totalEarned: { type: number }
        totalWithdrawn: { type: number }
        referralCode: { type: string }
        referredBy: { type: ["integer", "null"] }
        isBanned: { type: boolean }
        isVerified: { type: boolean }
        isFlagged: { type: boolean }
        flagReason: { type: ["string", "null"] }
        vpnStrikeCount: { type: integer }
        vpnBlockedUntil: { type: ["string", "null"], format: date-time }
        todayAdsWatched: { type: integer }
        todayTasksCount: { type: integer }
        totalTasksCount: { type: integer }
        rejectedWithdrawCount: { type: integer }
        createdAt: { type: string, format: date-time }
        lastActiveAt: { type: string, format: date-time }

    AuthResponse:
      type: object
      required: [user, isAdmin]
      properties:
        user: { $ref: "#/components/schemas/User" }
        isAdmin: { type: boolean }

    Task:
      type: object
      required: [id, title, description, reward, type, link, telegramChatId, isActive, createdAt]
      properties:
        id: { type: integer }
        title: { type: string }
        description: { type: ["string", "null"] }
        reward: { type: number }
        type: { $ref: "#/components/schemas/TaskType" }
        link: { type: ["string", "null"] }
        telegramChatId: { type: ["string", "null"] }
        isActive: { type: boolean }
        createdAt: { type: string, format: date-time }

    TaskWithStatus:
      allOf:
        - $ref: "#/components/schemas/Task"
        - type: object
          required: [completed]
          properties:
            completed: { type: boolean }

    TaskInput:
      type: object
      required: [title, reward, type]
      properties:
        title: { type: string, minLength: 1 }
        description: { type: string }
        reward: { type: number, minimum: 0 }
        type: { $ref: "#/components/schemas/TaskType" }
        link: { type: string }
        telegramChatId: { type: ["string", "null"] }
        isActive: { type: boolean }

    TaskUpdate:
      type: object
      properties:
        title: { type: string, minLength: 1 }
        description: { type: string }
        reward: { type: number, minimum: 0 }
        type: { $ref: "#/components/schemas/TaskType" }
        link: { type: string }
        telegramChatId: { type: ["string", "null"] }
        isActive: { type: boolean }

    TaskCompletion:
      type: object
      required: [id, taskId, userId, reward, completedAt]
      properties:
        id: { type: integer }
        taskId: { type: integer }
        userId: { type: integer }
        reward: { type: number }
        completedAt: { type: string, format: date-time }

    TaskCompletionResult:
      type: object
      required: [user, completion]
      properties:
        user: { $ref: "#/components/schemas/User" }
        completion: { $ref: "#/components/schemas/TaskCompletion" }

    WatchAdInput:
      type: object
      required: [network]
      properties:
        network: { $ref: "#/components/schemas/AdNetwork" }

    AdWatch:
      type: object
      required: [id, network, reward, watchedAt]
      properties:
        id: { type: integer }
        network: { $ref: "#/components/schemas/AdNetwork" }
        reward: { type: number }
        watchedAt: { type: string, format: date-time }

    AdWatchResult:
      type: object
      required: [user, adWatch]
      properties:
        user: { $ref: "#/components/schemas/User" }
        adWatch: { $ref: "#/components/schemas/AdWatch" }

    ReferralUser:
      type: object
      required: [id, firstName, username, photoUrl, joinedAt]
      properties:
        id: { type: integer }
        firstName: { type: string }
        username: { type: ["string", "null"] }
        photoUrl: { type: ["string", "null"] }
        joinedAt: { type: string, format: date-time }

    ReferralsSummary:
      type: object
      required: [referralCode, referralBonus, totalReferrals, totalReferralEarnings, referrals]
      properties:
        referralCode: { type: string }
        referralBonus: { type: number }
        totalReferrals: { type: integer }
        totalReferralEarnings: { type: number }
        referrals:
          type: array
          items: { $ref: "#/components/schemas/ReferralUser" }

    WithdrawalInput:
      type: object
      required: [method, accountNumber, amount]
      properties:
        method: { $ref: "#/components/schemas/WithdrawalMethod" }
        accountNumber: { type: string, minLength: 5 }
        amount: { type: number, minimum: 1 }

    Withdrawal:
      type: object
      required:
        - id
        - amount
        - method
        - accountNumber
        - status
        - requestedAt
        - processedAt
        - note
      properties:
        id: { type: integer }
        amount: { type: number }
        method: { $ref: "#/components/schemas/WithdrawalMethod" }
        accountNumber: { type: string }
        status: { $ref: "#/components/schemas/WithdrawalStatus" }
        requestedAt: { type: string, format: date-time }
        processedAt: { type: ["string", "null"], format: date-time }
        note: { type: ["string", "null"] }

    PublicConfig:
      type: object
      required:
        - minWithdraw
        - baseMinWithdraw
        - referralBonus
        - adReward
        - adDailyLimit
        - adDurationSeconds
        - botUsername
        - channelUsername
        - adminUsername
        - monetagZoneId
